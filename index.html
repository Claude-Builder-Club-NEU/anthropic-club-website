<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-route title, description, canonical, OG/Twitter tags and JSON-LD
         are injected here at build time by scripts/prerender.mjs from
         src/lib/seo.js. The values below are only what a dev-server visit sees;
         nothing shipped to production comes from this block. -->
    <!--app-head-->
    <title>Claude Builders Club @ Northeastern</title>

    <meta name="theme-color" content="#d97757" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Fonts: self-hosted woff2, latin subset. No third-party font requests.
         Only the single display weight used above the fold is preloaded. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/poppins-latin-600.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
