[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0 — the previous "18" could not have built this.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true
