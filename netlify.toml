[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0 — the previous "18" could not have
  # built this project.
  NODE_VERSION = "22"

# NOTE: the `/* -> /index.html 200` catch-all that used to live here has been
# removed deliberately. Every route is now prerendered to a real HTML file, so
# Netlify serves them directly and falls back to 404.html with a genuine HTTP
# 404 for anything unknown. The old rule returned 200 for every URL on the
# domain, which told crawlers that every typo was a valid page.

# A ballot lives at /polls/<slug>, and a poll is added by dropping a JSON file
# into src/lib/polls/. There is therefore no prerendered HTML per slug and there
# should not be: polls close, and stale files would outlive them.
#
# This is a SCOPED rewrite, not the catch-all the note above describes removing.
# It serves the polls hub's HTML for anything under /polls/ so the client router
# can resolve the slug, and it does so at 200 because the URL really is a page.
# Every path outside /polls/ still falls through to a genuine 404. An unknown
# slug is handled inside the app, which can say "that poll is not here" next to
# a link to the ones that are, rather than a bare 404 page.
[[redirects]]
  from = "/polls/*"
  to = "/polls/index.html"
  status = 200

# /workshops became /events. These are permanent, so anything already linking to
# the old path (Instagram bio, Linktree, a flyer QR code, search results) follows
# through instead of hitting the 404 page. The splat rule covers the pitch form
# and anything added under the section later.
[[redirects]]
  from = "/workshops/*"
  to = "/events/:splat"
  status = 301

[[redirects]]
  from = "/workshops"
  to = "/events"
  status = 301

# A short link to say out loud and print on a slide: claudeneu.com/slack.
#
# A redirect rather than a page, so there is nothing to load and nothing to
# read. Netlify matches this before it serves any file, so no HTML, no
# JavaScript and no React route is involved, and it works with scripting off.
#
# 302, NOT 301, and that is the whole decision here. The other redirects in this
# file are permanent moves between paths this site owns. This one points at a
# THIRD PARTY url that can change: Slack's signup path, the workspace domain, or
# the approved email domains. A 301 is cached by the browser more or less
# forever, so anyone who followed the link once would keep being sent to the old
# destination long after we fixed it, and we would have no way to reach them.
#
# The destination is SLACK_WORKSPACE in src/lib/links.js, and it is duplicated
# here because TOML cannot import it. That file carries the full reasoning for
# why it is the /signup path and not the bare workspace url or a shared invite.
# CHANGE BOTH TOGETHER.
[[redirects]]
  from = "/slack"
  to = "https://claudebuildersclub.slack.com/signup"
  status = 302

# Long-cache the fingerprinted build output.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are content-stable and self-hosted.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Blog image derivatives, written by scripts/build-blog-images.mjs.
#
# NOT `immutable`, unlike /assets/*. These filenames carry a width but no
# content hash, so replacing a picture reuses its URL. Pinning them forever
# would strand the old bytes in every visitor's cache with no way to evict them.
#
# The path is /blog-img/ and not /blog/ deliberately: a rule written for
# "/blog/*" would also match the prerendered /blog/<slug>/index.html and put an
# image cache policy on the post pages themselves.
[[headers]]
  for = "/blog-img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

    # Force HTTPS for a year. Netlify already serves this domain over TLS only,
    # so this closes the first-visit downgrade window rather than changing how
    # anything is served. `preload` is deliberately NOT set: that commits the
    # domain to a browser-shipped list which is slow and awkward to undo, and it
    # should be an explicit decision rather than a side effect of a header edit.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Nothing here uses a camera, a microphone, a location or a payment handler.
    # Denying them outright means a future dependency cannot quietly start.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"

    # Content Security Policy. Derived from what the built output actually
    # requests, not from a template:
    #
    #   script-src   the one fingerprinted bundle, plus Google Tag Manager,
    #                which src/lib/analytics.js injects at runtime once
    #                VITE_GA_ID exists. The only inline <script> tags are
    #                application/ld+json, which is data and is never executed,
    #                so no hash or nonce is needed and 'unsafe-inline' is not
    #                granted to scripts.
    #   connect-src  Web3Forms takes the workshop pitch POST; the analytics
    #                hosts take GA4 beacons, including its regional endpoints;
    #                and the Supabase project takes attendance check-ins.
    #
    #                The host is the club's own project and must match the
    #                first label of VITE_SUPABASE_URL. If the project is ever
    #                recreated the ref changes, and check-in then fails with a
    #                CSP violation that looks like a bug in the form and is not.
    #
    #                Named host, not https://*.supabase.co. The wildcard would
    #                let any page on this origin talk to ANY Supabase project,
    #                including one an attacker controls, which is most of what
    #                connect-src is here to prevent. Every other entry in this
    #                policy was derived from a request the build actually makes,
    #                and this one is held to the same standard.
    #   img-src      data: is required because Vite inlines the small brand SVGs.
    #   style-src    'unsafe-inline' is required: React writes layout values as
    #                inline style attributes. Style injection cannot execute
    #                script, and the alternative is rewriting every style prop
    #                in the codebase to buy very little.
    #   frame-src / object-src  nothing is embedded, so both are shut off.
    #   frame-ancestors  the modern replacement for X-Frame-Options above,
    #                which is kept for older browsers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com https://rdbyncjtnmjqgncrauwl.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; form-action 'self'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Events come from a Google Calendar read at BUILD time, so the site only
# refreshes when it rebuilds. That is automated in
# .github/workflows/refresh-events.yml, which re-reads the calendar hourly and
# pushes only when it changed. Optionally add a Netlify build hook and store it
# as the NETLIFY_BUILD_HOOK repository secret for a more direct trigger.
